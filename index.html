<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meu primeiro site com JavaScript</title>
</head>
<body>
    <h1>Meu primeiro site com JavaScript</h1>
    <div class="horario">
        <h2>Horário atual</h2>
        <p id="relogio">00:00:00</p>
    </div>
    <div class="Entrada">
        <h3>Entrada no evento</h3>
        <input type="text" id="idade" placeholder="Digite sua idade">
        <button id="verificar">Verificar idade</button>
        <p id="mensagem"></p>
    </div>
    <div class="aparencia">
    <h4>Aparência do site</h4>
    <button id="mudar">Mudar tema</button>        
    </div>
    <script src="script.js"></script>
</body>
</html>
